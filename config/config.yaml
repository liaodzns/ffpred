# ============================================================================
# Fantasy Football ML - project configuration
#
# Every tunable setting in this project lives here. Source code should read
# values from this file rather than hard coding them, so that experiments can
# be run by editing configuration instead of editing Python.
# ============================================================================

project:
  name: fantasy-football-ml
  random_seed: 42


# ----------------------------------------------------------------------------
# Data pull settings
# ----------------------------------------------------------------------------
data:
  # Seasons to download from nflreadpy. Set end_season to null to use
  # nflreadpy.get_current_season() at runtime.
  #
  # start_season is the first season the model may be trained, early stopped,
  # or scored on. It is not the first season downloaded.
  start_season: 2022
  end_season: null

  # Warmup season. Downloaded and used to build rolling features, then dropped
  # from the feature matrix before any model sees it. Null means no warmup.
  #
  # Without it, every player's first three games of start_season fall below
  # features.min_prior_games and are discarded, which cost 2022 its opening
  # three weeks entirely and 28% of its rows. One prior season is enough to
  # carry the longest rolling window into week 1, and pulling further back
  # reaches into a meaningfully different era of NFL offense.
  warmup_start_season: 2021

  # Skill positions modeled. Kickers and team defenses are out of scope.
  positions:
    - QB
    - RB
    - WR
    - TE

  # Season type kept when cleaning. A redraft league finishes in the regular
  # season, so postseason weeks 19 through 22 are dropped. They are a different
  # competitive context, played by a quarter of the league, and keeping them
  # would pollute both the target and the rolling features built from it.
  season_type: REG

  # Tables pulled by src/ffml/data/ingest.py. Set a table to false to skip it.
  tables:
    player_stats: true      # load_player_stats  - backbone table, target and features
    schedules: true         # load_schedules     - opponent, home/away, betting lines
    snap_counts: true       # load_snap_counts   - playing time
    rosters_weekly: true    # load_rosters_weekly- team and active status by week
    players: true           # load_players       - id crosswalk and birthdate
    ff_opportunity: true    # load_ff_opportunity- expected fantasy points
    depth_charts: true      # load_depth_charts  - expected role
    injuries: true          # load_injuries      - status and practice participation
    pbp: false              # load_pbp           - deferred to a later version

  paths:
    raw: data/raw
    processed: data/processed
    predictions: data/predictions
    models: models

  # Drop player-weeks where the player was not active. Bye weeks and inactive
  # games are not zero-point performances; they are absent performances, and
  # training on them as zeros teaches the model the wrong thing.
  drop_inactive_weeks: true


# ----------------------------------------------------------------------------
# League scoring rules
#
# These are the actual rules for this league, taken from the Yahoo settings
# page. They differ from both prebuilt nflverse fantasy point columns, so the
# target must be computed from box score statistics in src/ffml/data/clean.py.
#
# Differences from the built-in fantasy_points_ppr column:
#   1. Passing yards are 20 per point here, not 25.
#   2. Interceptions cost 1 point here, not 2.
#   3. There is a 100 yard rushing bonus, which no built-in column includes.
#   4. There is a 100 yard receiving bonus, same reason.
#
# Yardage rules are written as "yards per point" to match how the league site
# displays them, which reduces transcription mistakes. The scoring function
# divides yards by this number rather than multiplying.
#
# NOTE FOR IMPLEMENTATION: verify the exact column names against the loaded
# player stats frame before writing the scoring function. The nflverse stats
# schema has been revised over time, and names such as `interceptions` versus
# `passing_interceptions` vary by version. There is also no single fumbles lost
# column; it is the sum of the sack, rushing, and receiving fumble lost columns.
# ----------------------------------------------------------------------------
scoring:
  format_name: "Yahoo custom - full PPR with yardage bonuses"

  # False means the target is computed from box score stats rather than read
  # from a prebuilt column. Leave this false for this league.
  use_prebuilt_column: false

  # Name of the target column created by clean.py.
  target_column: fantasy_points_league

  passing:
    yards_per_point: 20
    touchdown: 4
    interception: -1
    two_point_conversion: 2

  rushing:
    yards_per_point: 10
    touchdown: 6
    two_point_conversion: 2
    bonus:
      threshold_yards: 100
      points: 3
      # False awards the bonus once at the threshold, so a 200 yard game still
      # earns 3 points. True awards it again at every multiple of the
      # threshold. Yahoo normally does not repeat; confirm in league settings.
      repeating: false

  receiving:
    reception: 1
    yards_per_point: 10
    touchdown: 6
    two_point_conversion: 2
    bonus:
      threshold_yards: 100
      points: 1
      repeating: false

  misc:
    fumble_lost: -2
    fumble_return_touchdown: 6

    # Kick and punt return touchdowns, credited to the player who returned it.
    # Verified against the data: the prebuilt nflverse fantasy point columns
    # include this at 6 points, and without it a standard PPR reproduction of
    # fantasy_points_ppr misses on exactly the 75 return touchdown rows.
    special_teams_touchdown: 6

# Kicker and team defense rules are recorded here for reference only. They are
# not used, because those positions are out of scope for the model.
#
# kicker:
#   point_after_made: 1
#   field_goal_total_yards_per_point: 10
#   field_goal_missed_0_19: -2
#   field_goal_missed_20_29: -1
#
# defense_special_teams:
#   sack: 1
#   interception: 2
#   fumble_recovery: 2
#   touchdown: 6
#   safety: 2
#   blocked_kick: 2
#   return_touchdown: 6
#   extra_point_returned: 2
#   points_allowed:
#     "0": 10
#     "1-6": 8
#     "7-13": 5
#     "14-20": 3
#     "21-27": 2
#     "28-34": 1
#     "35+": 0


# ----------------------------------------------------------------------------
# Feature engineering
#
# Every rolling statistic must be shifted by one game before use. See the data
# leakage section of CLAUDE.md.
# ----------------------------------------------------------------------------
features:
  rolling_windows:
    - 3
    - 5
    - 8

  # Player-weeks with fewer than this many prior games are dropped from
  # training, because their rolling features are mostly empty. Rookies early in
  # the season are the main group affected.
  min_prior_games: 3

  # Feature groups, toggled per position.
  #
  # default applies to every position, and by_position overrides single groups
  # for one position: the same shape as model.lightgbm.shared and by_position.
  # A group that helps receivers need not help quarterbacks, whose points come
  # from a different process and whose sample is about a quarter the size.
  #
  # The default is stage six's WR setting, carried over unchanged.
  #
  # opponent_strength is ON. Stage five measured it once, in one ordering, on
  # one season, and recorded it as harmful. Tested directly against the shipped
  # WR set over twice the rows it improves MAE by 0.0352 with a standard error
  # of 0.0118, t = -3.0. The stage five verdict was an artefact of too little
  # data and one arbitrary ordering.
  #
  # player_attributes is OFF, and the question is genuinely unresolved rather
  # than settled: for WR its effect is -0.0100 against a standard error of
  # 0.0130, t = -0.8. That is well inside the noise, so there is no evidence to
  # turn it on and none to call it useless either.
  #
  # injuries is OFF by default. The stage seven study found no effect for QB,
  # RB, or WR, and a marginal one for TE; see the TE override below and
  # src/ffml/features/injuries.py for why the signal is weak by construction.
  #
  # For QB, RB, and TE, stage seven tested every group once against the
  # shipped set. Every result but one kept the inherited default: QB's
  # game_context and opportunity are strongly confirmed (removing either
  # hurts at t = +4.1 and +4.9, surviving correction), and the rest were
  # inconclusive, which under the pre-registered rule keeps the default.
  #
  # Rerun scripts/train_model.py --feature-study after changing anything here.
  groups:
    default:
      rolling_production: true
      usage_share: true
      opportunity: true
      game_context: true
      opponent_strength: true
      player_attributes: false
      injuries: false
    by_position:
      QB: {}
      RB: {}
      WR: {}
      TE:
        # Turned on by the stage seven study, on MARGINAL evidence. Adding the
        # injury report improved TE MAE by 0.0258, SE 0.0121, t = -2.13. That
        # clears the pre-registered two standard error rule but fails both the
        # Bonferroni (|t| > 3.02) and Holm corrections across the 20 tests run,
        # and with 20 tests about 0.9 results are expected to clear two standard
        # errors by chance. It was the only favourable group result to do so.
        # Treat it as a weak signal to recheck when more seasons exist.
        injuries: true

  # Box score columns turned into lagged rolling means, per position and group.
  # The league target is appended to rolling_production automatically, so its
  # three game mean stays identical to the naive baseline.
  #
  # Chosen on lagged signal: how well each column's shifted three game mean
  # tracks the next game's league points, 2022 to 2024. A column meaningless for
  # a position is left out entirely rather than built and left empty.
  source_columns:
    QB:
      # Volume, efficiency, and rushing. Passing yards and touchdowns restate
      # attempts and the target, so they are left out.
      rolling_production: [attempts, passing_epa, rushing_yards]
      # For a quarterback, snap share mostly says whether he started or was
      # pulled, which is exactly the thing worth knowing.
      usage_share: [offense_pct]
      opportunity: [total_fantasy_points_exp, pass_touchdown_exp]
    RB:
      # Carries against targets separates an early down back from a pass
      # catching one, and in full PPR the two score very differently. A derived
      # carry share was measured and rejected: it tracks raw carries almost
      # exactly and adds nothing.
      rolling_production: [carries, rushing_yards, targets]
      usage_share: [offense_pct, target_share]
      opportunity: [total_fantasy_points_exp, rush_touchdown_exp]
    WR:
      rolling_production: [targets, receptions, receiving_yards, receiving_tds]
      usage_share: [offense_pct, target_share]
      opportunity: [total_fantasy_points_exp, rec_touchdown_exp]
    TE:
      # Smaller than the WR set on purpose: tight ends have about half the rows.
      rolling_production: [targets, receiving_yards]
      usage_share: [offense_pct, target_share]
      opportunity: [total_fantasy_points_exp, rec_touchdown_exp]

  # Number of prior weeks used to compute how many points a defense has allowed
  # to each position. Null means use all completed weeks of the current season.
  opponent_lookback_weeks: null


# ----------------------------------------------------------------------------
# Validation
#
# Splits are always by time. Never shuffle randomly, because that leaks future
# information into the training set.
# ----------------------------------------------------------------------------
validation:
  # Simple holdout used during early development.
  train_through_season: 2023
  validation_season: 2024
  test_season: 2025

  # Inner split, used only to choose the number of boosting rounds.
  #
  # Rows in early_stopping_season from early_stopping_from_week onward are held
  # out of fitting and are what early stopping watches. validation_season is
  # then seen by neither fitting nor stopping, so its score is honest. Stopping
  # on the scored season instead, as stage four did, picks the stopping round
  # to suit the very rows being reported and flatters the result.
  #
  # The cut is by week rather than by season so that training keeps 2022 plus
  # most of 2023. Holding out all of train_through_season would leave 2022
  # alone in the training set, which is both small and the weakest season in
  # the file, since no prior year exists for its rolling windows to draw on.
  early_stopping_season: 2023
  early_stopping_from_week: 14

  # Walk-forward validation, the more honest evaluation. Retrains once per test
  # season, training on everything before it and stopping on the tail of the
  # season immediately preceding it.
  #
  # first_test_season is 2023 rather than 2022 because a 2022 fold would have
  # no training seasons: 2021 exists only as warmup. last_test_season is stated
  # rather than derived from test_season so the sealed season never has to be
  # read to work out which folds to run.
  #
  # Pooling two folds roughly doubles the scored rows, which is the point: it
  # is the only lever left for shrinking the error bars on a feature group's
  # effect, given the seasons available.
  walk_forward:
    enabled: true
    first_test_season: 2023
    last_test_season: 2024


# ----------------------------------------------------------------------------
# Models
# ----------------------------------------------------------------------------
model:
  # Naive predictor that every real model is judged against.
  baseline:
    method: rolling_mean
    window: 3

  type: lightgbm

  # One model is trained per position, so parameters are given per position.
  #
  # These values were never tuned, on purpose. Stage nine measured the seed
  # noise floor first, and at every position seed luck alone moved pooled MAE
  # by as much as the effects a search would be looking for, so no position was
  # searched. See model.tuning below and the per-position notes under
  # by_position.
  lightgbm:
    shared:
      objective: regression
      metric: mae
      learning_rate: 0.05
      num_leaves: 31
      min_data_in_leaf: 40
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 1
      num_boost_round: 1000
      early_stopping_rounds: 50
      verbosity: -1

    # Per position overrides. QB has far fewer rows than WR, so it needs
    # simpler trees to avoid overfitting.
    #
    # Stage nine outcome, per position: NOT TUNED, parameters unchanged. Each
    # figure is from ten seeds on the walk-forward folds, pooled MAE, compared
    # with the 0.02 to 0.04 MAE effects this project has been chasing.
    by_position:
      # QB: seed range 0.157, SD 0.049, worst versus best seed t = 3.91. Four to
      # eight times the effects a search would look for, so not searched. Seed
      # 42, the shipped seed, was QB's best of ten, so its shipped MAE of 6.7774
      # is optimistic; the ten-seed mean is 6.8577.
      QB:
        num_leaves: 15
        min_data_in_leaf: 20
      # RB: seed range 0.049, SD 0.015, worst versus best seed t = 2.76. Above
      # the whole effect band, so not searched.
      RB: {}
      # WR: seed range 0.036, SD 0.013, worst versus best seed t = 2.86. At the
      # top of the effect band, so not searched.
      WR: {}
      # TE: seed range 0.037, SD 0.013, worst versus best seed t = 2.69. At the
      # top of the effect band, so not searched.
      TE:
        num_leaves: 20
        min_data_in_leaf: 25

  # Hyperparameter tuning, and the measurement that gates it.
  #
  # Before any search, each position's walk-forward model is retrained under
  # every seed below with nothing else changed. The best-to-worst range of
  # pooled MAE is the noise floor. An effect smaller than it cannot be told
  # apart from a lucky seed, however large its paired t, because the paired
  # standard error counts row sampling but not training randomness.
  #
  # A position is searched only if its range is below the smallest effect a
  # search would be looking for, the lower end of effect_band. In stage nine no
  # position cleared that, so nothing was searched. Rerun the measurement with
  # scripts/train_model.py --noise-floor.
  #
  # If a search is ever run, the pre-registered adoption rule is that the
  # improvement over current parameters, averaged across these seeds, must
  # exceed two paired standard errors AND this range. Both, not either.
  tuning:
    noise_floor_seeds: [42, 1, 2, 3, 4, 5, 6, 7, 8, 9]
    effect_band: [0.02, 0.04]

  # Quantile models for floor and ceiling projections. Deferred to version two,
  # but the settings are here so the code can be written to support them.
  quantiles:
    enabled: false
    levels:
      - 0.1
      - 0.5
      - 0.9


# ----------------------------------------------------------------------------
# Evaluation
# ----------------------------------------------------------------------------
evaluation:
  metrics:
    - mae
    - rmse
    - spearman_within_position_week

  # Always print the baseline scores next to the model scores. A model that
  # does not beat the baseline is not working, no matter how good its raw
  # error looks.
  always_compare_to_baseline: true

  # Paired significance tests in the feature study.
  #
  # decision_t is the pre-registered rule from stage six: a feature group's
  # toggle changes only when flipping it improves MAE by more than this many
  # paired standard errors.
  #
  # family_alpha is the family-wise error rate used to report whether a result
  # would survive a Bonferroni or Holm correction for the number of tests run.
  # It is reported beside every decision rather than used to make it, and a
  # result that clears decision_t but fails the correction is labelled
  # marginal, since with twenty tests about one will clear two standard errors
  # by chance alone.
  decision_t: 2.0
  family_alpha: 0.05

  # Report metrics separately for these groups, so that a model that is strong
  # overall but weak on starters is not hidden by bench players.
  breakdowns:
    - position
    - season


# ----------------------------------------------------------------------------
# Prediction
# ----------------------------------------------------------------------------
predict:
  # Season and week to project. Null means use nflreadpy.get_current_season()
  # and get_current_week() at runtime.
  season: null
  week: null

  # Only project players who meet these conditions, to keep the output list
  # readable rather than including every rostered player in the league.
  min_snap_share_last_3: 0.25
  output_format: csv

  # Injury report statuses that exclude a player from projection. The models
  # have effectively never seen these, because a player ruled out does not play
  # and so has no box score row to train on. In 2022-2024, 0 of 912 skill
  # players listed Out played, and 1 of 171 listed Doubtful did. Questionable
  # players played 57% of the time and are projected, with a flag.
  #
  # This reads the report whether or not it carries a timestamp. It is a filter
  # on who gets projected, not a model input, so it cannot leak into a feature.
  excluded_report_statuses:
    - Out
    - Doubtful

  # Deployment models, trained for live projections on all completed data.
  # These are separate from the walk-forward evaluation models, which are saved
  # directly under data.paths.models and are never overwritten by deployment.
  deployment:
    # The most recent completed weeks held out to choose the number of boosting
    # rounds. Five matches the walk-forward folds' weeks 14 to 18 tail, so the
    # stopping decision is made on a comparably sized set. Once the round count
    # is chosen, the model is refit on every completed week at that count,
    # because the most recent weeks say the most about next week's game.
    early_stopping_weeks: 5

    # Groups switched off for deployment only. Injuries are off because nflverse
    # publishes no date_modified for any 2025 or 2026 report, so the pre-kickoff
    # timestamp rule admits none of them and every row would read not_listed.
    # Its only measured effect was marginal for TE. Remove it from this list if
    # the timestamps return.
    disabled_groups:
      - injuries

    # Directory under data.paths.models the deployment models are saved to.
    model_subdirectory: deployment


# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
logging:
  level: INFO
  log_row_counts: true