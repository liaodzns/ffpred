[project]
name = "fantasy-football-ml"
version = "0.1.0"
description = "Weekly fantasy football point projections for NFL skill position players"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Data access. nflreadpy pulls from the nflverse repositories and returns
    # Polars frames, which this project converts to pandas at ingest.
    "nflreadpy>=0.1.5",

    # Core data handling. pyarrow is required for reading and writing the
    # Parquet files that every pipeline stage uses.
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",

    # Modeling. scipy supplies the Spearman rank correlation used in
    # evaluation, and scikit-learn supplies metrics and the linear baseline.
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "scipy>=1.13",

    # Configuration loading.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffml"]


# ----------------------------------------------------------------------------
# Linting and formatting
#
# The rule set is deliberately small. This project prefers plain, explicit code
# over idiomatic compression, so the comprehension and lambda rules that ruff
# would normally suggest are left off on purpose. See the code style section of
# CLAUDE.md.
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # outdated syntax
    "B",    # common bug patterns
]
ignore = [
    "E501",   # line length is handled by the formatter
    "C4",     # do not push list and dict comprehensions
    "SIM",    # do not push "simplifications" that reduce readability here
]

[tool.ruff.format]
quote-style = "double"


# ----------------------------------------------------------------------------
# Type checking
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true

# Strictness is kept moderate on purpose. Full strict mode fights constantly
# with pandas, and the friction is not worth it on a project this size.
disallow_untyped_defs = false
check_untyped_defs = true


# ----------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"